<title>Clínica Bujanda Platform</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400;1,6..96,500&family=Jost:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: editorial arch hero + quiet ivory bands for the public site; sidebar workspace for portals and back office. */
:root{
  --bg:#FAF8F4; --surface:#F2EDE4; --sand:#E4DACB; --line:#DDD3C4;
  --fg:#1F1D1A; --muted:#6B655D; --stone:#8C867D;
  --gold:#866B40; --gold-soft:#CBB68F; --inv:#FAF8F4; --ink:#1F1D1A;
  --ok:#3E6A4D; --warn:#8F6418; --bad:#9A3A31; --info:#3B5871;
  --ok-bg:#E3ECE3; --warn-bg:#F3E8D2; --bad-bg:#F3DEDA; --info-bg:#DFE7EE;
  --f-display:'Bodoni Moda',Didot,'Bodoni 72','Times New Roman',serif;
  --f-body:'Jost','Avenir Next','Helvetica Neue',Arial,sans-serif;
  --f-mono:'DM Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:2px; --ease:cubic-bezier(.2,.7,.2,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131211; --surface:#1C1A18; --sand:#2A2723; --line:#36312B;
  --fg:#EEE9E0; --muted:#A49D92; --stone:#8B847A;
  --gold:#CFB687; --gold-soft:#6E5D40; --inv:#131211; --ink:#EEE9E0;
  --ok:#86B795; --warn:#DDAE5E; --bad:#E4928A; --info:#93B3CE;
  --ok-bg:#1F2B22; --warn-bg:#2D2414; --bad-bg:#2E1B19; --info-bg:#1A2530; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131211; --surface:#1C1A18; --sand:#2A2723; --line:#36312B;
  --fg:#EEE9E0; --muted:#A49D92; --stone:#8B847A;
  --gold:#CFB687; --gold-soft:#6E5D40; --inv:#131211; --ink:#EEE9E0;
  --ok:#86B795; --warn:#DDAE5E; --bad:#E4928A; --info:#93B3CE;
  --ok-bg:#1F2B22; --warn-bg:#2D2414; --bad-bg:#2E1B19; --info-bg:#1A2530; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:16px;line-height:1.6;font-weight:400;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:400;line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:.6rem .75rem;width:100%;min-width:0}
textarea{resize:vertical;min-height:84px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-family:var(--f-body);font-size:.72rem;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);font-weight:500}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.tiny{font-size:.74rem}

/* demo strip + header */
.demo-strip{background:var(--ink);color:var(--inv);font-size:.76rem;letter-spacing:.04em}
.demo-strip .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-block:7px}
.demo-strip button{background:transparent;border:1px solid color-mix(in srgb,var(--inv) 40%,transparent);color:var(--inv);padding:3px 10px;border-radius:99px;font-size:.74rem;letter-spacing:.06em}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;gap:20px;padding-block:14px}
.logo{display:flex;flex-direction:column;line-height:1;background:none;border:0;padding:0;text-align:left}
.logo b{font-family:var(--f-display);font-weight:400;font-size:1.55rem;letter-spacing:.32em}
.logo span{font-size:.58rem;letter-spacing:.42em;text-transform:uppercase;color:var(--muted);margin-top:5px}
.nav{display:flex;gap:2px;flex:1;justify-content:center;flex-wrap:wrap}
.nav button{background:none;border:0;padding:6px 10px;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);position:relative}
.nav button:hover,.nav button.on{color:var(--fg)}
.nav button.on::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:1px;background:var(--gold)}
.hdr-tools{display:flex;align-items:center;gap:10px}
.lang{display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden}
.lang button{background:none;border:0;padding:4px 10px;font-size:.72rem;letter-spacing:.14em;color:var(--muted)}
.lang button.on{background:var(--ink);color:var(--inv)}
.icon-btn{background:none;border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:.76rem;letter-spacing:.08em;display:inline-flex;gap:6px;align-items:center}
.menu-btn{display:none}
@media (max-width:1080px){.nav{display:none}.menu-btn{display:inline-flex}.nav.open{display:flex;position:absolute;top:100%;left:0;right:0;flex-direction:column;background:var(--bg);border-bottom:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-left,0px)) 18px}.nav.open button{text-align:left;padding:10px 0}.nav.open button.on::after{display:none}}
@media (max-width:560px){.hdr-tools .hide-sm{display:none}.logo b{font-size:1.2rem}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--r);padding:.78rem 1.3rem;font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;font-weight:500;border:1px solid var(--ink);background:var(--ink);color:var(--inv);transition:background .25s var(--ease),color .25s var(--ease)}
.btn:hover{background:transparent;color:var(--fg)}
.btn.ghost{background:transparent;color:var(--fg)}
.btn.ghost:hover{background:var(--ink);color:var(--inv)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--inv)}
.btn.gold:hover{background:transparent;color:var(--gold)}
.btn.sm{padding:.45rem .8rem;font-size:.7rem;letter-spacing:.12em}
.btn[disabled]{opacity:.4;pointer-events:none}
.link{background:none;border:0;padding:0;border-bottom:1px solid var(--gold);font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--fg)}

/* hero */
.hero{padding-block:clamp(28px,5vw,64px) clamp(36px,6vw,80px)}
.hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:clamp(24px,5vw,72px);align-items:center}
.hero h1{font-size:clamp(2.6rem,6.4vw,5.6rem);line-height:.98}
.hero h1 em{font-style:italic;color:var(--gold)}
.hero-copy{display:grid;gap:26px}
.hero-copy p{max-width:44ch;color:var(--muted);font-size:1.06rem}
.hero-ctas{display:flex;gap:12px;flex-wrap:wrap}
.slide-anim{animation:rise .9s var(--ease) both}
@keyframes rise{from{opacity:.0;transform:translateY(14px)}to{opacity:1;transform:none}}
.slide-ctrl{display:flex;align-items:center;gap:16px;margin-top:6px}
.slide-ctrl .bar{flex:1;max-width:220px;height:1px;background:var(--line);position:relative;overflow:hidden}
.slide-ctrl .bar i{position:absolute;inset:0;background:var(--gold);transform-origin:left;animation:fill 7s linear both}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.slide-ctrl button{background:none;border:1px solid var(--line);width:36px;height:36px;border-radius:99px}
.slide-ctrl .count{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
@media (max-width:820px){.hero-grid{grid-template-columns:1fr}.hero-art{order:-1;max-width:420px}}

/* placeholder art */
.art{position:relative;width:100%;max-width:100%;overflow:hidden;background:var(--surface);isolation:isolate}
.art::before{content:"";position:absolute;inset:0;z-index:-1;background:
  radial-gradient(60% 50% at 70% 30%,color-mix(in srgb,var(--gold-soft) 55%,transparent),transparent 70%),
  radial-gradient(70% 60% at 20% 90%,color-mix(in srgb,var(--sand) 90%,transparent),transparent 70%),
  linear-gradient(160deg,var(--surface),var(--sand))}
.art svg{position:absolute;inset:0;width:100%;height:100%}
.art svg path{fill:none;stroke:var(--gold);stroke-width:1.1;opacity:.75}
.art-tag{position:absolute;left:12px;bottom:12px;font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;background:color-mix(in srgb,var(--bg) 80%,transparent);color:var(--muted);padding:4px 8px;border-radius:99px}
.arch{aspect-ratio:4/5;border-radius:999px 999px var(--r) var(--r)}
.art.v2::before{background:radial-gradient(55% 45% at 30% 30%,color-mix(in srgb,var(--gold-soft) 60%,transparent),transparent 70%),linear-gradient(200deg,var(--sand),var(--surface))}
.art.v3::before{background:radial-gradient(50% 50% at 50% 60%,color-mix(in srgb,var(--stone) 30%,transparent),transparent 70%),linear-gradient(140deg,var(--surface),var(--sand) 70%)}
.hero-art{position:relative;justify-self:center;width:100%}
.hero-art .badge-float{position:absolute;right:-6px;bottom:18%;background:var(--bg);border:1px solid var(--line);padding:12px 16px;max-width:210px;font-size:.78rem;line-height:1.45}
.hero-art .badge-float b{display:block;font-family:var(--f-display);font-weight:400;font-size:1.15rem}

/* sections */
.band{padding-block:clamp(52px,8vw,104px)}
.band.alt{background:var(--surface)}
.band.ink{background:var(--ink);color:var(--inv)}
.band.ink .muted{color:color-mix(in srgb,var(--inv) 65%,transparent)}
.band.ink .eyebrow{color:var(--gold-soft)}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:clamp(28px,4vw,48px)}
.sec-head h2{font-size:clamp(2rem,4.2vw,3.4rem);margin-top:10px}
.sec-head p{max-width:52ch}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,5vw,64px);align-items:center}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
@media (max-width:900px){.grid3,.grid4{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}
@media (max-width:560px){.grid3,.grid4{grid-template-columns:1fr}}
.prose{display:grid;gap:16px;max-width:62ch}
.prose p{color:var(--muted)}
.quote{font-family:var(--f-display);font-style:italic;font-size:clamp(1.5rem,3vw,2.3rem);line-height:1.25}

.tile{background:none;border:0;border-top:1px solid var(--line);padding:22px 0 0;text-align:left;display:grid;gap:10px;align-content:start}
.tile h3{font-size:1.5rem}
.tile .arrow{font-family:var(--f-mono);color:var(--gold);font-size:.8rem}
.tile:hover h3{color:var(--gold)}
.card{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:grid;gap:12px;align-content:start;min-width:0}
.band.alt .card{background:var(--bg)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.chip.info{background:var(--info-bg);color:var(--info);border-color:transparent}
.chip.gold{border-color:var(--gold);color:var(--gold)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.notice{border-left:2px solid var(--gold);background:var(--surface);padding:12px 16px;font-size:.86rem;color:var(--muted)}
.notice b{color:var(--fg);font-weight:500}
.band.alt .notice{background:var(--bg)}

/* treatments */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px}
.filters button{background:none;border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:.76rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.filters button.on{background:var(--ink);color:var(--inv);border-color:var(--ink)}
.tgroup{border-top:1px solid var(--line);padding:20px 0;display:grid;grid-template-columns:240px 1fr;gap:20px}
.tgroup h3{font-size:1.4rem}
.tgroup ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:2px 24px}
.tgroup li button{background:none;border:0;padding:7px 0;text-align:left;width:100%;display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);font-size:.95rem}
.tgroup li button:hover{color:var(--gold)}
.tgroup li button span{color:var(--gold);font-family:var(--f-mono);font-size:.75rem}
@media (max-width:700px){.tgroup{grid-template-columns:1fr;gap:8px}}

/* product */
.prod .art{aspect-ratio:1}
.prod h3{font-size:1.35rem}
.price{font-family:var(--f-mono);font-size:.95rem}

/* modal + toast */
.scrim{position:fixed;inset:0;z-index:80;background:color-mix(in srgb,var(--ink) 55%,transparent);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:fade .25s ease both}
@keyframes fade{from{opacity:0}}
.modal{background:var(--bg);color:var(--fg);width:min(760px,100%);max-height:100%;overflow:auto;border-radius:var(--r);padding:clamp(20px,4vw,40px);display:grid;gap:18px;animation:rise .4s var(--ease) both}
.modal-h{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.modal-h h2{font-size:clamp(1.6rem,3.4vw,2.4rem)}
.x{background:none;border:1px solid var(--line);border-radius:99px;width:36px;height:36px;flex:none}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--inv);padding:12px 18px;border-radius:var(--r);font-size:.86rem;max-width:min(560px,calc(100% - 32px));box-shadow:0 10px 30px rgba(0,0,0,.18);animation:rise .35s var(--ease) both}

/* forms */
.field{display:grid;gap:6px;min-width:0}
.field label{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.88rem}
.check input{width:auto;margin-top:4px}

/* workspace */
.ws{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 110px)}
.side{border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:2px;background:var(--surface)}
.side .who{padding:0 10px 18px;margin-bottom:10px;border-bottom:1px solid var(--line)}
.side .who b{font-family:var(--f-display);font-weight:400;font-size:1.2rem;display:block}
.side button{background:none;border:0;text-align:left;padding:9px 10px;border-radius:var(--r);font-size:.9rem;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.side button.on{background:var(--bg);color:var(--fg);box-shadow:inset 2px 0 0 var(--gold)}
.side button .n{font-family:var(--f-mono);font-size:.72rem;background:var(--gold);color:var(--inv);border-radius:99px;padding:0 7px}
.side .grp{font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;color:var(--stone);padding:16px 10px 6px}
.main{padding:clamp(18px,3vw,36px) max(16px,env(safe-area-inset-right,0px)) 60px clamp(18px,3vw,36px);min-width:0;display:grid;gap:24px;align-content:start}
.main h1{font-size:clamp(1.9rem,3.6vw,2.8rem)}
@media (max-width:900px){.ws{grid-template-columns:1fr}.side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-left,0px))}.side .who,.side .grp{display:none}.side button{white-space:nowrap;flex:none}.main{padding-left:max(16px,env(safe-area-inset-left,0px))}}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.kpi{background:var(--bg);padding:16px 18px;display:grid;gap:4px}
.kpi .v{font-family:var(--f-display);font-size:1.9rem;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.kpi .s{font-size:.76rem;color:var(--muted)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th{font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:500;text-align:left;padding:10px 12px;background:var(--surface);white-space:nowrap}
td{padding:11px 12px;border-top:1px solid var(--line);vertical-align:top}
td.num{font-family:var(--f-mono);text-align:right;white-space:nowrap}
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:230px;gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--surface);border-radius:var(--r);padding:10px;display:grid;gap:8px;align-content:start;min-height:120px}
.col h4{font-family:var(--f-body);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500;display:flex;justify-content:space-between}
.lead{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:grid;gap:6px;font-size:.84rem}
.lead b{font-weight:500}
.lead .row{gap:4px}
.lead .row button{background:none;border:1px solid var(--line);border-radius:var(--r);padding:1px 8px;font-size:.78rem}
.thread{display:grid;gap:12px;max-height:440px;overflow:auto;padding:4px}
.msg{max-width:78%;padding:10px 14px;border-radius:var(--r);background:var(--surface);font-size:.9rem;display:grid;gap:4px}
.msg.me{justify-self:end;background:var(--ink);color:var(--inv)}
.msg .meta{font-size:.7rem;opacity:.7}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps span{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;padding:4px 10px;border-bottom:1px solid var(--line);color:var(--muted)}
.steps span.on{border-color:var(--gold);color:var(--fg)}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.days button{flex:none;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px;display:grid;text-align:center;min-width:64px}
.days button b{font-family:var(--f-display);font-weight:400;font-size:1.4rem;line-height:1}
.days button.on{background:var(--ink);color:var(--inv);border-color:var(--ink)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.slots button{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:8px;font-family:var(--f-mono);font-size:.85rem}
.slots button.on{background:var(--gold);color:var(--inv);border-color:var(--gold)}
.slots button[disabled]{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.mp{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.mp-h{background:var(--info-bg);color:var(--info);padding:10px 16px;font-size:.78rem;letter-spacing:.06em;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.mp-b{padding:18px;display:grid;gap:14px}
.toggle{position:relative;width:40px;height:22px;flex:none;border-radius:99px;border:1px solid var(--line);background:var(--surface)}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:99px;background:var(--stone);transition:transform .2s var(--ease)}
.toggle.on{background:var(--gold);border-color:var(--gold)}
.toggle.on::after{transform:translateX(18px);background:var(--inv)}
.list-row{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.list-row>div{min-width:0}
.mapbox{aspect-ratio:16/10;max-width:100%;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);position:relative;overflow:hidden}
.mapbox svg{width:100%;height:100%;display:block}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.76rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}

/* footer */

 let body='';
 if(b.step===1){body=`<div class="grid2" style="align-items:stretch">${['pres','video'].map(t=>`<button class="card" style="text-align:left" data-act="bkType" data-arg="${t}"><span class="eyebrow">${t==='pres'?L('En la clínica','At the clinic'):L('Desde donde estés','From anywhere')}</span><h3 style="font-size:1.6rem">${t==='pres'?L('Consulta presencial','In-person consultation'):L('Videoconsulta','Video consultation')}</h3><span class="mono">${money(S.fees[t])}</span><span class="tiny muted">${L('Honorario de demostración, configurable desde el backend','Demo fee, configurable from the back office')}</span></button>`).join('')}</div>`}

  <p class="tiny muted">${L('Tachado: ocupado, bloqueado por la agenda o reservado temporalmente por otro paciente. Hora de Buenos Aires.','Struck through: taken, blocked or temporarily held by another patient. Buenos Aires time.')}</p>
  <div class="row"><button class="btn ghost sm" data-act="bkBack">${L('Volver','Back')}</button></div>`}
 if(b.step===3){body=`<div class="card"><div class="row between"><span class="eyebrow">${L('Resumen','Summary')}</span>${holdTag()}</div>
  <div class="list-row"><span>${b.type==='video'?L('Videoconsulta','Video consultation'):L('Consulta presencial','In-person consultation')}${b.proc?' · '+esc(b.proc):''}</span><b class="mono" style="font-weight:500">${money(S.fees[b.type])}</b></div>
  <div class="list-row"><span>${L('Fecha y hora','Date and time')}</span><b style="font-weight:500">${dt(b.slot)}</b></div>
  <div class="notice"><b>${L('Política de cancelación.','Cancellation policy.')}</b> ${L(`Cancelando con al menos ${S.policy.refundHours} horas de anticipación respecto del turno confirmado (hora de Buenos Aires) es elegible para reembolso. Con menos tiempo o el mismo día podés cancelar, sin devolución automática. Si cancela la clínica, se reintegra el total.`,`Cancelling at least ${S.policy.refundHours} hours before the confirmed appointment (Buenos Aires time) is eligible for a refund. With less notice or on the same day you can cancel, with no automatic refund. If the clinic cancels, you get a full refund.`)}</div>

 return `<div><span class="eyebrow">${L('Historial','History')}</span><h1>${L('Mis turnos','My appointments')}</h1></div><div class="card">${list.map(a=>{let act='';const fut=new Date(a.start)>NOW;
  if(fut&&['confirmado','pagado'].includes(a.status))act=`<button class="btn sm ghost" data-act="cancelPrev" data-arg="${a.id}">${L('Cancelar','Cancel')}</button>`;

function payRows(list){return `<div class="tbl-wrap"><table><thead><tr><th>${L('Fecha','Date')}</th><th>${L('Concepto','Item')}</th><th>${L('Estado','Status')}</th><th style="text-align:right">${L('Importe','Amount')}</th><th></th></tr></thead><tbody>${list.map(p=>`<tr><td>${dd(p.date)}</td><td>${payLabel(p)}</td><td>${chip(p.status,PST)}${p.noRefund?` <span class="chip">${L('sin reembolso automático','no auto refund')}</span>`:''}</td><td class="num">${money(p.amount)}</td><td>${p.status!=='pending'&&p.status!=='rejected'?`<button class="btn sm ghost" data-act="receipt" data-arg="${p.id}">${L('Comprobante','Receipt')}</button>`:''}</td></tr>`).join('')}</tbody></table></div>`}
function payLabel(p){if(p.kind==='consulta'){const a=S.appts.find(x=>x.id===p.ref);return (a?.type==='video'?L('Videoconsulta','Video consultation'):L('Consulta presencial','In-person consultation'))+(a?' · '+P(a.pid).name:'')}if(p.kind==='producto'){const o=S.orders.find(x=>x.id===p.ref);return L('Pedido','Order')+' '+p.ref.toUpperCase()+(o?' · '+P(o.pid).name:'')}const e=S.enrolls.find(x=>x.id===p.ref);return L('Inscripción','Enrollment')+(e?' · '+D(e.did).name:'')}
function pPagos(){const pid=ME.patient;const ids=S.appts.filter(a=>a.pid===pid).map(a=>a.id).concat(S.orders.filter(o=>o.pid===pid).map(o=>o.id));return `<div><span class="eyebrow">${L('Pagos','Payments')}</span><h1>${L('Pagos y comprobantes','Payments and receipts')}</h1></div>${payRows(S.pays.filter(p=>ids.includes(p.ref)).sort((a,b)=>b.date.localeCompare(a.date)))}<p class="tiny muted">${L('Estados sincronizados por webhook validado de Mercado Pago (en la demo, simulado en sandbox).','Statuses synced via validated Mercado Pago webhook (simulated in sandbox for this demo).')}</p>`}
function pPres(){const pid=ME.patient;return `<div><span class="eyebrow">${L('Presupuestos','Quotes')}</span><h1>${L('Mis presupuestos','My quotes')}</h1></div><div class="notice">${L('Los presupuestos son documentos comerciales. El consentimiento informado es un documento médico separado que se firma en consulta.','Quotes are commercial documents. Informed consent is a separate medical document signed in consultation.')}</div>

function thread(pid,me){const m=S.msgs[pid]||[];return `<div class="thread" id="thread">${m.map(x=>`<div class="msg ${x.from===me?'me':''}"><span>${esc(x.text)}</span>${x.file?`<span class="tiny">📎 ${esc(x.file)}</span>`:''}<span class="meta">${x.from==='doc'?'Dr. Bujanda':P(pid).name} · ${dt(x.at)}</span></div>`).join('')||`<p class="muted">${L('Sin mensajes.','No messages.')}</p>`}</div>`}

function monthly(){
 const cur={m:'2026-10',consulta:0,producto:0,capacitacion:0};
 S.pays.forEach(p=>{if(p.date.startsWith('2026-10')&&p.status!=='pending'&&p.status!=='rejected'){cur[p.kind]+=p.amount-(p.refunded||0)}});
 return S.hist.concat([cur]);
}
function barChart(rows){
 const w=640,h=250,pl=60,pb=28,pt=10,keys=[['consulta','var(--gold)'],['producto','var(--info)'],['capacitacion','var(--stone)']];
 const tot=rows.map(r=>r.consulta+r.producto+r.capacitacion);const step=1e6;const max=Math.ceil(Math.max(...tot)/step)*step||step;
 const y=v=>pt+(h-pt-pb)*(1-v/max);const bw=(w-pl-10)/rows.length;
 let g='';for(let v=0;v<=max;v+=step){g+=`<line x1="${pl}" x2="${w-10}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="DM Mono,monospace">${shortMoney(v)}</text>`}
 rows.forEach((r,i)=>{let acc=0;const x=pl+i*bw+bw*.22;keys.forEach(([k,c])=>{if(!r[k])return;const y1=y(acc+r[k]),y0=y(acc);g+=`<rect x="${x}" y="${y1}" width="${bw*.56}" height="${Math.max(0,y0-y1)}" fill="${c}"><title>${k}: ${money(r[k])}</title></rect>`;acc+=r[k]});
  g+=`<text x="${x+bw*.28}" y="${h-8}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="Jost,sans-serif">${dt(r.m+'-15',{month:'short'})}</text>`});
 return `<div class="chart"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${L('Ingresos cobrados por mes','Collected revenue by month')}">${g}</svg></div><div class="legend"><span><i style="background:var(--gold)"></i>${L('Consultas','Consultations')}</span><span><i style="background:var(--info)"></i>${L('Productos','Products')}</span><span><i style="background:var(--stone)"></i>${L('Capacitaciones','Trainings')}</span></div>`;
}

 const pendingPays=S.pays.filter(p=>p.status==='pending');const refunds=S.pays.filter(p=>p.status==='refunded'||p.status==='partial_refund');

 const fmax=Math.max(...fun.map(f=>f[1]),1);
 return `<div class="row between"><div><span class="eyebrow">${L('Octubre 2026 · datos ficticios','October 2026 · fictitious data')}</span><h1>${L('Buen día, doctor','Good morning, doctor')}</h1></div><button class="btn sm" data-act="sub" data-arg="solicitudes">${S.appts.filter(a=>a.status==='pagado').length} ${L('solicitudes por confirmar','requests to confirm')}</button></div>

  const id=nid('a'),pay=nid('y');S.appts.push({id,pid:ME.patient,type:b.type,start:b.slot,status:'pendiente_pago',pay,policyAt:new Date().toISOString(),note:b.proc||''});S.pays.push({id:pay,kind:'consulta',ref:id,amount:S.fees[b.type],status:'pending',date:ymd(NOW.toISOString())});b.appt=id;
  S.mp={kind:'consulta',amount:S.fees[b.type],title:(b.type==='video'?L('Videoconsulta','Video consultation'):L('Consulta presencial','In-person consultation'))+' · '+dt(b.slot),ref:id,appt:id,pay};S.modal={t:'mp'};audit('Aceptó la política de cancelación e inició pago de turno');R()},
 mpCancel(){if(S.mp?.kind==='consulta'){const a=S.appts.find(x=>x.id===S.mp.appt);if(a){S.appts=S.appts.filter(x=>x!==a);S.pays=S.pays.filter(p=>p.id!==S.mp.pay)}}S.mp=null;S.modal=null;R()},
 mpOk(){const x=S.mp;

  if(x.kind==='producto'){const bad=S.cart.find(([id,q])=>{const p=S.products.find(k=>k.id===id);return p.stock!==null&&p.stock<q});if(bad){toast(L('Stock insuficiente: el pago se reintegraría.','Insufficient stock: payment would be refunded.'));S.modal=null;R();return}
   const oid=nid('o'),pay=nid('y');const total=x.amount;S.cart.forEach(([id,q])=>{const p=S.products.find(k=>k.id===id);if(p.stock!==null)p.stock-=q});S.orders.unshift({id:oid,pid:S.role==='patient'?ME.patient:null,items:S.cart.map(c=>[c[0],c[1]]),total,pay,status:'preparando',date:ymd(NOW.toISOString())});S.pays.push({id:pay,kind:'producto',ref:oid,amount:total,status:'approved',date:ymd(NOW.toISOString())});S.cart=[];notify(S.role==='patient'?P(ME.patient).name:L('Invitado demo','Demo guest'),'compra');toast(L(`Pago aprobado. Pedido ${oid.toUpperCase()} en preparación; stock descontado.`,`Payment approved. Order ${oid.toUpperCase()} is being prepared; stock deducted.`))}
  if(x.kind==='capacitacion'){const e=S.enrolls.find(y=>y.id===x.enroll);const p=PAY(e.pay);p.status='approved';e.status='pagado';notify(D(e.did).name,'inscripcion',['email']);toast(L('Pago aprobado. Inscripción confirmada.','Payment approved. Enrollment confirmed.'))}
  S.mp=null;S.modal=null;R()},
 mpNo(){const x=S.mp;if(x.kind==='consulta'){S.appts=S.appts.filter(a=>a.id!==x.appt);const p=PAY(x.pay);if(p)p.status='rejected';toast(L('Pago rechazado (prueba). El horario sigue reservado mientras dure el contador.','Payment rejected (test). The slot stays held while the timer runs.'))}else if(x.kind==='capacitacion'){toast(L('Pago rechazado (prueba). La inscripción sigue pendiente.','Payment rejected (test). Enrollment stays pending.'))}else toast(L('Pago rechazado (prueba). No se descontó stock.','Payment rejected (test). No stock was deducted.'));S.mp=null;S.modal=null;R()},
 cancelPrev(a){S.modal={t:'cancel',arg:a};R()},
 cancelOk(a){const ap=S.appts.find(x=>x.id===a);const h=(new Date(ap.start)-NOW)/36e5;const p=PAY(ap.pay);ap.status='cancelado';if(h>=S.policy.refundHours){p.status='refund_requested';p.reason='paciente';ap.cancel={by:'paciente',refund:true}}else{p.noRefund=true;ap.cancel={by:'paciente',refund:false}}notify(P(ap.pid).name,'cancelacion');audit('Canceló turno '+a);S.modal=null;toast(L('Cancelación registrada.','Cancellation recorded.'));R()},

 propReject(a){const ap=S.appts.find(x=>x.id===a);delete ap.proposal;ap.status='cancelado';const p=PAY(ap.pay);p.status='refund_requested';p.reason='clinica';toast(L('Propuesta rechazada. Corresponde reintegro total.','Proposal declined. Full refund applies.'));R()},
 receipt(a){S.modal={t:'receipt',arg:a};R()},
 budAccept(a){const b=S.budgets.find(x=>x.id===a);b.status='aceptado';const l=S.leads.find(x=>x.pid===b.pid&&x.stage===6);if(l)l.stage=7;audit('Aceptó presupuesto '+a.toUpperCase());toast(L('Presupuesto aceptado. La clínica te contactará para programar.','Quote accepted. The clinic will contact you to schedule.'));R()},
 budAsk(a){const v=document.getElementById('ask-'+a).value.trim();if(!v){toast(L('Escribí tu consulta.','Write your question.'));return}const b=S.budgets.find(x=>x.id===a);b.status='aclaracion';b.question=v;toast(L('Consulta enviada al equipo.','Question sent to the team.'));R()},
 budView(a){S.modal={t:'budget',arg:a};R()},
 sendMsg(a){const t=document.getElementById('msg-in').value.trim();const f=document.getElementById('msg-file').files[0];if(!t&&!f){toast(L('Escribí un mensaje o adjuntá un archivo.','Write a message or attach a file.'));return}const pid=a==='doc'?(S.segP||'p1'):ME.patient;(S.msgs[pid]=S.msgs[pid]||[]).push({from:a,at:new Date().toISOString(),text:t||L('Archivo adjunto','Attachment'),file:f?f.name:null});if(a==='doc')notify(P(pid).name,'nuevo_mensaje');audit((a==='doc'?'Respondió':'Envió')+' mensaje de seguimiento');R();const th=document.getElementById('thread');if(th)th.scrollTop=th.scrollHeight},
 dl(a){toast(L(`“${a}”: en producción se descarga con un enlace firmado que vence en 5 minutos.`,`“${a}”: in production it downloads via a signed link that expires in 5 minutes.`))},
 enroll(a){if(S.role!=='pro'){S.after='pro';S.view='auth';toast(L('Ingresá al portal de profesionales para inscribirte.','Sign in to the professional portal to enroll.'));render();return}const w=W(a);const d=D(ME.pro);
  if(w.req&&!d.verified){S.enrolls.push({id:nid('e'),did:d.id,wid:a,status:'verificacion'});toast(L('Solicitud enviada. Verificaremos tu matrícula.','Request sent. We will verify your license.'));R();return}
  const id=nid('e'),pay=nid('y');S.enrolls.push({id,did:d.id,wid:a,status:'pago_pendiente',pay});S.pays.push({id:pay,kind:'capacitacion',ref:id,amount:w.ars,status:'pending',date:ymd(NOW.toISOString())});S.mp={kind:'capacitacion',amount:w.ars,title:w[S.lang],ref:id,enroll:id};S.modal={t:'mp'};R()},
 enrollPay(a){const e=S.enrolls.find(x=>x.id===a);const w=W(e.wid);S.mp={kind:'capacitacion',amount:w.ars,title:w[S.lang],ref:a,enroll:a};S.modal={t:'mp'};R()},
 proPref(a){const d=D(ME.pro);d.consent[a]=!d.consent[a];audit('Actualizó consentimiento '+a);R()},
 apptConfirm(a){const ap=S.appts.find(x=>x.id===a);ap.status='confirmado';notify(P(ap.pid).name,'turno_confirmado');audit('Confirmó turno de '+P(ap.pid).name);const t=S.tasks.find(x=>x.id==='t1');toast(L('Turno confirmado. Aviso enviado por email y WhatsApp.','Appointment confirmed. Notice sent by email and WhatsApp.'));R()},
 apptReject(a){const ap=S.appts.find(x=>x.id===a);ap.status='rechazado';const p=PAY(ap.pay);p.status='refund_requested';p.reason='clinica';notify(P(ap.pid).name,'turno_rechazado');audit('Rechazó turno de '+P(ap.pid).name);toast(L('Solicitud rechazada. Reintegro total pendiente de autorización.','Request declined. Full refund pending authorization.'));R()},
 apptPropose(a){const v=document.getElementById('prop-'+a).value;const ap=S.appts.find(x=>x.id===a);ap.proposal=v;ap.status='reprogramar';notify(P(ap.pid).name,'reprogramacion');audit('Propuso nueva fecha a '+P(ap.pid).name);toast(L('Propuesta enviada al paciente.','Proposal sent to the patient.'));R()},
 agDay(a){S.agDay=a;R()},
 block(a){S.blocked.includes(a)?S.blocked=S.blocked.filter(x=>x!==a):S.blocked.push(a);audit('Modificó disponibilidad '+a);R()},
 remind(a){const ap=S.appts.find(x=>x.id===a);ap.reminded=true;notify(P(ap.pid).name,'recordatorio');toast(L('Recordatorio enviado (plantilla neutra).','Reminder sent (neutral template).'));R()},
 wlOffer(a){const w=S.waitlist.find(x=>x.id===a);const s=freeSlots(1)[0];S.waitlist=S.waitlist.filter(x=>x!==w);notify(w.name,'reprogramacion');toast(L(`Ofrecido ${dt(s)} a ${w.name}. Queda reservado al pagar.`,`Offered ${dt(s)} to ${w.name}. Held once paid.`));R()},
 lead(a){const [id,d]=a.split(':');const l=S.leads.find(x=>x.id===id);l.stage=Math.min(11,Math.max(0,l.stage+Number(d)));audit(`Movió ${id} a “${STAGES[l.stage][0]}”`);R()},
 patient(a){S.clinicOpen=null;S.modal={t:'patient',arg:a};R()},
 clinic(a){S.clinicOpen=a;audit('Accedió a la ficha clínica de '+P(a).name);R()},
 feeSave(){S.fees.pres=+document.getElementById('fee-pres').value||S.fees.pres;S.fees.video=+document.getElementById('fee-video').value||S.fees.video;S.policy.refundHours=+document.getElementById('pol-h').value||24;audit('Actualizó honorarios y política');toast(L('Honorarios y política actualizados. Se aplican a nuevas reservas.','Fees and policy updated. They apply to new bookings.'));R()},
 refund(a){const [id,m]=a.split(':');const p=PAY(id);if(m==='full'){p.status='refunded';p.refunded=p.amount}else if(m==='half'){p.status='partial_refund';p.refunded=Math.round(p.amount/2)}else{p.status='approved';p.noRefund=true}if(m!=='deny')notify(payLabel(p).split(' · ')[1]||'',"reembolso");audit(`Resolvió reembolso ${id}: ${m}`);toast(m==='deny'?L('Reembolso denegado.','Refund denied.'):L('Reembolso autorizado. En producción se ejecuta vía API de Mercado Pago.','Refund authorized. In production it runs through the Mercado Pago API.'));R()},
 exception(a){const p=PAY(a);p.noRefund=false;p.status='refund_requested';p.reason='excepcion';audit('Autorizó excepción de reembolso '+a);toast(L('Excepción autorizada: pasa a reembolsos a autorizar.','Exception granted: moved to refunds to authorize.'));R()},
 prodToggle(a){const p=S.products.find(x=>x.id===a);p.active=!p.active;R()},
 stock(a){const [id,d]=a.split(':');const p=S.products.find(x=>x.id===id);p.stock=Math.max(0,p.stock+Number(d));R()},
 price(a){const p=S.products.find(x=>x.id===a);p.price=+document.getElementById('pr-'+a).value||p.price;toast(L('Precio actualizado.','Price updated.'));R()},
 wsPub(a){const w=W(a);w.published=!w.published;if(w.published){let n=0;PROS.forEach(d=>{if(d.consent.email){notify(d.name,'nuevo_workshop',['email']);n++}if(d.consent.wa){notify(d.name,'nuevo_workshop',['whatsapp']);n++}});toast(L(`Publicado. ${n} avisos enviados según consentimiento.`,`Published. ${n} notices sent per consent.`))}R()},
 verify(a){const e=S.enrolls.find(x=>x.id===a);const d=D(e.did);d.verified=true;const pay=nid('y');e.status='pago_pendiente';e.pay=pay;S.pays.push({id:pay,kind:'capacitacion',ref:e.id,amount:W(e.wid).ars,status:'pending',date:ymd(NOW.toISOString())});audit('Verificó matrícula de '+d.name);toast(L('Matrícula verificada. Se habilitó el pago.','License verified. Payment enabled.'));R()},
 testi(a){const t=S.testimonials.find(x=>x.id===a);t.published=!t.published;R()},
 seoEdit(a){S.modal={t:'seo',arg:+a};R()},
 perm(a){S.perms[a]=!S.perms[a];audit(`Permiso de secretaría “${a}”: ${S.perms[a]?'habilitado':'deshabilitado'}`);R()}
};
const C={
 bkPolicy(t){S.bk.policy=t.checked;R()},
 crmQ(t){S.crmF=Object.assign(S.crmF||{},{q:t.value});R()},
 crmCh(t){S.crmF=Object.assign(S.crmF||{},{ch:t.value});R()},
 segP(t){S.segP=t.value;R()},
 proSpec(t){S.proF=Object.assign(S.proF||{},{spec:t.value});R()},
 proCountry(t){S.proF=Object.assign(S.proF||{},{country:t.value});R()},
 orderSt(t){const o=S.orders.find(x=>x.id===t.dataset.id);o.status=t.value;if(t.value==='listo'){notify(o.pid?P(o.pid).name:'Invitado demo','pedido_preparado',['whatsapp']);toast(L('Aviso de pedido listo enviado por WhatsApp.','Order-ready notice sent on WhatsApp.'))}R()},
 task(t){const k=S.tasks.find(x=>x.id===t.dataset.id);k.done=t.checked;R()}
};
const F={
 taylor(){S.leads.push({id:'L-'+(1050+(++uid)),name:document.getElementById('tm-name').value+' (Taylor Made)',proc:'Taylor Made · '+document.getElementById('tm-goal').value,channel:'Web',owner:'Dr. Bujanda',date:ymd(NOW.toISOString()),stage:3,next:'Contactar por '+document.getElementById('tm-ch').value});toast(L('Solicitud recibida. Se registró en el CRM como “Evaluación solicitada”.','Request received. Logged in the CRM as “Evaluation requested”.'));R()},
 auth(){if(S.authTab==='rec'){toast(L('Si el email existe, enviaremos un enlace de recuperación (demo).','If the email exists, we will send a reset link (demo).'));return}S.role=S.after==='pro'?'pro':'patient';const a=S.after;S.after=null;if(a==='patient'&&S.bk&&S.bk.step===1&&S.bk.proc!==undefined){S.view='patient';S.sub='reservar';render();return}go(S.role)},
 intake(){S.intakeSent[ME.patient]=new Date().toISOString();audit('Envió formulario de admisión');toast(L('Formulario enviado.','Form submitted.'));R()},
 budget(){const pid=document.getElementById('bu-p').value;S.budgets.unshift({id:nid('b'),pid,proc:document.getElementById('bu-t').value,amount:+document.getElementById('bu-a').value,status:'enviado',date:ymd(NOW.toISOString())});notify(P(pid).name,'presupuesto');audit('Emitió presupuesto a '+P(pid).name);toast(L('Presupuesto emitido y notificado.','Quote issued and notified.'));R()},
 doc(){const pid=S.segP||'p1';const type=document.getElementById('doc-t').value;if(type==='Receta'){toast(L('Las recetas se emiten desde la plataforma de prescripción electrónica habilitada (integración pendiente).','Prescriptions are issued from the authorized e-prescription platform (integration pending).'));return}S.docs.unshift({pid,name:document.getElementById('doc-n').value,type,by:'Dr. Diego Bujanda',date:ymd(NOW.toISOString())});notify(P(pid).name,'nuevo_documento');audit('Publicó documento para '+P(pid).name);toast(L('Documento publicado. Aviso neutro enviado.','Document published. Neutral notice sent.'));R()},
 campaign(){const f=S.proF||{};const list=PROS.filter(p=>(!f.spec||p.spec===f.spec)&&(!f.country||p.country===f.country)&&p.consent.email);list.forEach(p=>notify(p.name,'nuevo_workshop',['email']));toast(L(`Campaña enviada a ${list.length} profesionales con consentimiento.`,`Campaign sent to ${list.length} professionals with consent.`));R()},
 bio(){S.bio.es=document.getElementById('bio-es').value;S.bio.en=document.getElementById('bio-en').value;audit('Editó biografía del médico');toast(L('Biografía publicada en el perfil médico.','Biography published on the doctor profile.'));R()},
 seo(form){const p=S.seo[+form.dataset.i];p.title=document.getElementById('seo-t').value;p.desc=document.getElementById('seo-d').value;p.reviewed=document.getElementById('seo-r').value;p.alts=+document.getElementById('seo-a').value;p.hreflang=document.getElementById('seo-h').checked;audit('Editó SEO de '+p.path);S.modal=null;toast(L('SEO actualizado.','SEO updated.'));R()},
 aitest(){S.aiTests.unshift({date:ymd(NOW.toISOString()),engine:document.getElementById('ai-e').value,q:document.getElementById('ai-q').value,mentioned:document.getElementById('ai-m').checked});R()},
 task(){S.tasks.push({id:nid('t'),text:document.getElementById('task-in').value,done:false});R()}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;if(b.disabled)return;if(b.dataset.act==='noop')return;const fn=A[b.dataset.act];if(fn){if(b.tagName==='A')return;e.preventDefault();fn(b.dataset.arg,b)}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.ch&&C[t.dataset.ch])C[t.dataset.ch](t)});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.ch==='count'){const el=document.getElementById(t.dataset.target);if(el)el.textContent=t.value.length}});
document.addEventListener('submit',e=>{const f=e.target;if(f.dataset.form&&F[f.dataset.form]){e.preventDefault();F[f.dataset.form](f)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.modal){S.modal=null;R()}});
setInterval(()=>{if(!S.hold)return;const s=Math.round((S.hold.until-Date.now())/1000);const el=document.getElementById('holdClock');if(s<=0){S.hold=null;if(S.bk.step===3){S.bk.step=2;S.bk.slot=null;toast(L('La reserva temporal venció y el horario se liberó.','The hold expired and the slot was released.'));R()}return}if(el)el.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},1000);
(function(){const h=(location.hash||'').slice(1);const map={tratamientos:'treatments',doctor:'doctor',taylor:'taylor',instalaciones:'facilities',turismo:'tourism',tienda:'shop',workshops:'workshops',notas:'notes',faq:'faq'};if(map[h])S.view=map[h];render()})();
